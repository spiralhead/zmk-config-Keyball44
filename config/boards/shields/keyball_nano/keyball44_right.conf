CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=2800
CONFIG_PMW3610_CPI_DIVIDOR=4
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=1000
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=24
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- TEMPORARY DIAGNOSTIC LOGGING (remove after debugging OLED) ---
CONFIG_ZMK_USB_LOGGING=y
# Quiet ZMK's own keymap/mouse/BLE DBG spam so the boot sequence is
# readable and doesn't overflow the deferred log ring buffer.
CONFIG_ZMK_LOG_LEVEL_WRN=y
# Keep the display + I2C drivers verbose.
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_DBG=y
# Turn silent stack overflows on the dedicated display thread into a
# visible MPU fault (nRF52840 has an MPU).
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=y
# LVGL warnings (e.g. out-of-memory while rendering the status screen).
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y
# --- END TEMPORARY DIAGNOSTIC LOGGING ---
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
